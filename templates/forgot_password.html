<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기 - Vulnerable Bank</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon-16.svg') }}" sizes="16x16">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("vb-theme") || "light");</script>
</head>
<body class="auth-page">
    <a href="#forgotForm" class="skip-link">재설정 양식으로 건너뛰기</a>

    <!-- Brand Panel -->
    <div class="auth-brand">
        <div class="auth-brand-content">
            <div class="brand-logo">
                <div class="brand-logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                </div>
                <span class="brand-logo-text">VulnBank</span>
            </div>
            <h2>비밀번호를 잊으셨나요?</h2>
            <p>걱정 마세요. 사용자 이름을 입력하시면 재설정 방법을 안내해 드립니다.</p>
        </div>
    </div>

    <!-- Form Panel -->
    <div class="auth-form-panel">
        <div class="auth-form-container">
            <h1>비밀번호 재설정</h1>
            <p class="auth-subtitle">재설정 PIN을 받으려면 사용자 이름을 입력하세요.</p>

            <div id="message"></div>

            <form id="forgotForm">
                <div class="auth-input-group">
                    <input type="text" name="username" id="username" placeholder="사용자 이름" required aria-label="사용자 이름">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </div>
                <button type="submit">재설정 PIN 요청</button>
            </form>

            <div class="auth-links">
                <a href="{{ url_for('login') }}">로그인으로 돌아가기</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('forgotForm').addEventListener('submit', async (event) => {
                event.preventDefault();
                const formData = new FormData(event.target);
                const jsonData = {};
                formData.forEach((value, key) => jsonData[key] = value);

                try {
                    const response = await fetch('/api/v3/forgot-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(jsonData)
                    });
                    const data = await response.json();
                    document.getElementById('message').innerHTML = data.message;
                    document.getElementById('message').className = data.status === 'success' ? 'success' : 'error';
                    if (data.status === 'success') {
                        setTimeout(() => {
                            window.location.href = '/reset-password';
                        }, 2000);
                    }
                } catch (error) {
                    document.getElementById('message').innerHTML = '요청에 실패했습니다. 다시 시도해 주세요.';
                    document.getElementById('message').className = 'error';
                }
            });
        });
    </script>
</body>
</html>
